services:
  ai:
    build:
      context: .
    container_name: ai-service
    restart: unless-stopped
    environment:
      AI_CONFIG: /app/config.yaml
      # Override these at runtime when targeting Render, e.g.
      # $env:BACKEND_URL="https://<service>.onrender.com"; docker compose -f ai/docker-compose.ai.yml up -d --build
      BACKEND_URL: "${BACKEND_URL:-http://backend:3000}"
      NAMESPACE: "${NAMESPACE:-/ingest}"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./models:/models:ro
    depends_on:
      - dummy  
    networks: [traffic-net]

  dummy:
    image: alpine:3.20
    command: ["sh", "-c", "sleep 360000"]
    networks: [traffic-net]
    restart: unless-stopped

networks:
  traffic-net:
    external: true
